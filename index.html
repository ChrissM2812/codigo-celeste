<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Código Celeste</title>
<meta name="description" content="Código Celeste: sistema de alerta y respuesta ante crisis emocionales en el campus. El Wi-Fi detecta, una persona confirma y una brigada capacitada llega en minutos.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{
  --bg:#000;--surface:#0a0d0f;--sunk:#050708;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.16);--fg:#eeeeee;--muted:#999999;
  --celeste:#00b4d9;--celeste-deep:#46d5e6;--celeste-soft:rgba(0,180,217,.1);--alert:#ff6b4f;--alert-soft:rgba(255,107,79,.1);
  --ok:#3fc48a;--ok-soft:rgba(63,196,138,.1);--warn:#e0a63a;--chip:#00b4d9;--chip-fg:#000;--gold:#b8963e;
  --card-bg:linear-gradient(rgba(255,255,255,.04),rgba(255,255,255,.02)),linear-gradient(135deg,rgba(6,118,158,.08),transparent);
  --on-accent:#000;color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f6f6f6;--surface:#ffffff;--sunk:#ededed;--line:rgba(26,26,26,.12);--line-2:rgba(26,26,26,.24);--fg:#1a1a1a;--muted:rgba(26,26,26,.62);
  --celeste:#0092b0;--celeste-deep:#00708a;--celeste-soft:rgba(0,146,176,.09);--alert:#d24a30;--alert-soft:rgba(210,74,48,.09);
  --ok:#23885a;--ok-soft:rgba(35,136,90,.1);--warn:#a8740a;--chip:#1a1a1a;--chip-fg:#eaf6fb;
  --card-bg:rgba(255,255,255,.96);--on-accent:#fff;color-scheme:light;
}
:root{--ease:cubic-bezier(.22,1,.36,1);--f-sans:"Inter",system-ui,sans-serif;--f-tech:"Rajdhani","Arial Narrow",sans-serif;--f-serif:"Cormorant Garamond",Georgia,serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;--grad:linear-gradient(60deg,#0090a9,#33c2d5 50%,#46d5e6)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-sans);overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:var(--celeste);color:#000}
h1,h2,h3,h4{margin:0 0 .6rem}
h1{font:800 clamp(2.4rem,8vw,4.6rem)/.98 var(--f-sans);letter-spacing:.06em;text-transform:uppercase}
h2{font:400 clamp(1.8rem,4.2vw,2.9rem)/1.08 var(--f-serif);letter-spacing:0}
h3{font:500 1.55rem/1.15 var(--f-serif)}
h4{font:700 1.05rem/1.2 var(--f-tech);letter-spacing:.04em;text-transform:uppercase}
p{margin:0 0 .75rem}
a{color:inherit;text-decoration-color:var(--celeste);text-underline-offset:3px}
a:hover{color:var(--celeste)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{display:flex;align-items:center;gap:12px;font:500 12px/1.2 var(--f-tech);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}
.eyebrow::before{content:"";width:24px;height:1px;background:var(--celeste);flex-shrink:0}
.lead{font-size:clamp(1rem,2vw,1.12rem);line-height:1.6;max-width:50ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo-mark{display:block;flex-shrink:0}

/* Botones */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:0 20px;border-radius:0;border:1px solid var(--line-2);background:transparent;cursor:pointer;font:600 13px/1 var(--f-tech);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--fg);transition:background .2s,color .2s,border-color .2s,transform .25s var(--ease)}
.btn:hover{border-color:var(--fg);color:var(--fg)}
.btn:focus-visible,.tab:focus-visible,.role:focus-visible,.choice:focus-visible,.qrow:focus-visible,.pchip:focus-visible,.roombtn:focus-visible,.lp-links button:focus-visible{outline:2px solid var(--celeste);outline-offset:2px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--celeste);border-color:var(--celeste);color:#000;padding-right:52px}
.btn.primary::after{content:"";position:absolute;right:18px;top:50%;width:22px;height:1px;background:currentColor;transition:width .25s var(--ease)}
.btn.primary:hover{background:var(--celeste-deep);border-color:var(--celeste-deep);color:#000}
.btn.primary:hover::after{width:30px}
.btn.primary.sm{padding-right:42px}
.btn.primary.sm::after{right:14px;width:16px}
.btn.dark{background:#000;border-color:#000;color:var(--celeste);padding-right:52px}
.btn.dark::after{content:"";position:absolute;right:18px;top:50%;width:22px;height:1px;background:currentColor;transition:width .25s var(--ease)}
.btn.dark:hover{color:#46d5e6}
.btn.dark:hover::after{width:30px}
.btn.danger{background:var(--alert);border-color:var(--alert);color:#140502}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#021209}
.btn.ghost{border-color:transparent;padding:0 10px;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:12px}
.btn.block{width:100%}
.btn,.btn.sm,.btn.ghost{padding-top:8px;padding-bottom:8px;line-height:1.25;text-align:center}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}

/* Cabecera de la app */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
header.top::after{content:"";display:block;height:2px;background:var(--grad)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px;position:relative;overflow:hidden}
.top-in::before{content:"";position:absolute;bottom:0;left:0;width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--celeste),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{from{transform:translateX(-120px)}to{transform:translateX(100vw)}}
.brand{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--f-tech);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;color:var(--fg)}
.brand-sub{display:block;border-left:1px solid var(--line-2);padding-left:12px;margin-left:4px;font:600 10px/1.25 var(--f-tech);letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.role-tag{display:none}
.top-actions{margin-left:auto;display:flex;gap:4px;align-items:center;flex-shrink:0}
.tabs{max-width:1200px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:0 14px;counter-reset:tb}
.tabs::-webkit-scrollbar{display:none}
.tabs.fade-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.tabs.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 48px);mask-image:linear-gradient(90deg,transparent,#000 48px)}
.tabs.fade-l.fade-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 48px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,transparent,#000 48px,#000 calc(100% - 48px),transparent)}
.tab{flex:0 0 auto;padding:12px 8px 10px;border:0;background:none;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;font:600 13px/1 var(--f-tech);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;counter-increment:tb;transition:color .2s}
.tab::before{content:counter(tb,decimal-leading-zero) "  ";color:var(--line-2)}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--celeste)}
.tab.on::before{color:var(--celeste)}
main{max-width:1200px;margin:0 auto;padding:36px 20px 72px}
.foot{max-width:1200px;margin:0 auto;padding:22px 20px 32px;color:var(--muted);font:500 12px/1.6 var(--f-tech);letter-spacing:.12em;text-transform:uppercase;border-top:1px solid var(--line)}

/* Interruptor */
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:600 12px/1 var(--f-tech);letter-spacing:.12em;text-transform:uppercase;position:relative;user-select:none;color:var(--muted)}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sl{width:32px;height:18px;border-radius:99px;border:1px solid var(--line-2);position:relative;transition:.2s;flex-shrink:0}
.sl::after{content:"";position:absolute;top:3px;left:3px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:.25s var(--ease)}
.sw input:checked+.sl{border-color:var(--celeste)}
.sw input:checked+.sl::after{transform:translateX(14px);background:var(--celeste)}
.sw input:focus-visible+.sl{outline:2px solid var(--celeste);outline-offset:2px}

/* Bloques */
.card{background:var(--card-bg);background-color:var(--surface);border:1px solid var(--line);border-radius:0;padding:22px;min-width:0;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.16);transition:border-color .35s}
.card.is-alert{border-color:color-mix(in srgb,var(--alert) 55%,transparent)}
.card.is-alert::before,.card.is-ok::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--alert)}
.card.is-ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.card.is-ok::before{background:var(--ok)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);margin-bottom:26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:20px 18px 18px;background:var(--bg);min-width:0}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi b{display:block;font:800 2.5rem/1 var(--f-sans);letter-spacing:-.02em;margin-bottom:8px}
.kpi.red b{color:var(--alert)}
.kpi span{font:600 12px/1.3 var(--f-tech);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stack>*+*{margin-top:18px}
.row-b{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2,.sec-h h3{margin:0}
.note{border:1px solid var(--line);border-left:2px solid var(--celeste);padding:14px 16px}
.note.alert{border-left-color:var(--alert);background:var(--alert-soft)}
.note.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line-2)}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
@media (max-width:860px){.g2,.g3,.split{grid-template-columns:minmax(0,1fr)}}

/* Tags de estado */
.pill{display:inline-flex;align-items:center;gap:.45rem;padding:4px 10px;border-radius:0;font:600 11px/1.2 var(--f-tech);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;border:1px solid}
.pill.red{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 40%,transparent);background:var(--alert-soft)}
.pill.green{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.pill.cel{color:var(--celeste);border-color:color-mix(in srgb,var(--celeste) 35%,transparent);background:var(--celeste-soft)}
.pill.amb{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.pill.mut{color:var(--muted);border-color:var(--line-2)}
.pill.red::before,.pill.green::before,.pill.amb::before,.pill.cel::before{content:"";width:5px;height:5px;background:currentColor}
.pill.red::before{animation:blink 1.6s ease-in-out infinite}

/* Patentes */
.pchips{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.pchip{display:inline-flex;align-items:center;font:700 11px/1 var(--f-tech);letter-spacing:.06em;padding:4px 6px;border-radius:0;background:var(--chip);color:var(--chip-fg);border:1px solid var(--chip);cursor:pointer;transition:transform .2s var(--ease)}
.pchip:hover{transform:translateY(-2px)}
.pchip.ante{background:transparent;color:var(--chip);border:1px dashed var(--chip)}
body.no-pat .pchips,body.no-pat .pchip{display:none}
body.no-pat .patgrid .pchip{display:inline-flex}
#ppanel{position:fixed;z-index:80;width:min(320px,calc(100vw - 32px));background:var(--surface);color:var(--fg);border:1px solid var(--line-2);border-top:2px solid var(--celeste);padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
#ppanel[hidden]{display:none}
.pp-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pp-h .x{margin-left:auto;background:none;border:0;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.pp-num{font-size:.95rem;color:var(--celeste);margin-bottom:4px}
#ppanel b{font:500 1.3rem/1.2 var(--f-serif);display:block}
#ppanel a{font:600 12px var(--f-tech);letter-spacing:.14em;text-transform:uppercase}
#ppanel a::after{content:" ↗"}

/* Imágenes */
.fig{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:0;border:1px solid var(--line);background:var(--sunk)}
.fig.wide{aspect-ratio:21/9}
.fig.contain{object-fit:contain;aspect-ratio:auto;height:auto;background:#0d1b26}
.mod-head{margin:-6px 0 26px;overflow:hidden}
.mod-head .fig{transition:transform .8s var(--ease)}
.mod-head:hover .fig{transform:scale(1.02)}
.comp-wrap img+.comp-cards{display:none}
.comp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.comp-cards .card b{font:400 2.2rem var(--f-serif);color:var(--celeste);display:block}

/* ============ LANDING ============ */
.lp{background:#000;color:#eee}
.lp .muted{color:#999}
.lp-nav{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lp-nav::after{content:"";display:block;height:2px;background:var(--grad)}
.lp-nav-in{max-width:1200px;margin:0 auto;height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;position:relative;overflow:hidden}
.lp-nav-in::before{content:"";position:absolute;bottom:0;left:0;width:120px;height:1px;background:linear-gradient(90deg,transparent,#00b4d9,transparent);animation:sweep 7s linear infinite}
.lp-links{margin-left:auto;display:flex;gap:2px;align-items:center}
.lp-links button:not(.btn){background:none;border:0;cursor:pointer;color:rgba(238,238,238,.72);font:600 13px/1 var(--f-tech);letter-spacing:.12em;text-transform:uppercase;padding:10px 10px}
.lp-links button:not(.btn):hover{color:#00b4d9}
.lp .brand{color:#eee}
.lp .brand-sub{color:rgba(238,238,238,.6);border-color:rgba(255,255,255,.16)}
@media (max-width:900px){.lp-links button:not(.btn){display:none}}

.lp-hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;overflow:hidden;padding:96px 0 90px}
.lp-hero .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.lp-hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#000 0%,rgba(0,0,0,.92) 32%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.35) 100%)}
.lp-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:35%;z-index:1;background:linear-gradient(0deg,#000,transparent)}
.lp-hero-in{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:0 20px;width:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:center}
.lp-hero h1{color:#fff;margin:0 0 18px}
.lp-hero h1 span{display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lp-hero .lp-mark{margin-bottom:26px}
.lp-sub{font:500 13px/1.5 var(--f-tech);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.68);margin-bottom:16px}
.lp-hero .lead{color:rgba(238,238,238,.86)}
.lp-hero .btn:not(.primary){color:#eee;border-color:rgba(255,255,255,.15)}
.lp-hero .btn:not(.primary):hover{border-color:#eee;background:#eee;color:#000}
.lp-team{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),linear-gradient(135deg,rgba(6,118,158,.22),rgba(6,77,103,.08));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:26px 26px 22px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.lp-team-h{display:flex;align-items:center;gap:16px;padding-bottom:18px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12)}
.lp-team-h small{display:block;font:500 11px/1.2 var(--f-tech);letter-spacing:.24em;text-transform:uppercase;color:rgba(238,238,238,.64);margin-bottom:6px}
.lp-team-h b{display:block;font:700 22px/1 var(--f-tech);letter-spacing:.12em;text-transform:uppercase;color:#fff}
.lp-team dl{margin:0}
.lp-team dt{font:600 11px/1.2 var(--f-tech);letter-spacing:.22em;text-transform:uppercase;color:#00b4d9;margin:16px 0 6px}
.lp-team dd{margin:0;color:#eee;font-size:15px;line-height:1.5}
.lp-team ol{list-style:none;margin:0;padding:0;counter-reset:mm}
.lp-team li{counter-increment:mm;display:grid;grid-template-columns:28px 1fr;padding:7px 0;border-top:1px solid rgba(255,255,255,.08);font-size:15px;color:#eee}
.lp-team li:first-child{border-top:0}
.lp-team li::before{content:counter(mm,decimal-leading-zero);font:600 12px/1.6 var(--f-tech);letter-spacing:.08em;color:rgba(238,238,238,.45)}
.lp-scroll{position:absolute;z-index:2;right:28px;bottom:28px;display:flex;flex-direction:column;align-items:center;gap:10px;font:600 11px var(--f-tech);letter-spacing:.24em;text-transform:uppercase;color:rgba(238,238,238,.6);writing-mode:vertical-rl}
.lp-scroll i{display:block;width:1px;height:60px;background:rgba(255,255,255,.16);position:relative;overflow:hidden}
.lp-scroll i::after{content:"";position:absolute;left:0;top:0;width:1px;height:24px;background:#00b4d9;animation:sl 2.2s var(--ease) infinite}
@keyframes sl{from{transform:translateY(-24px)}to{transform:translateY(60px)}}
@media (max-width:960px){.lp-hero-in{grid-template-columns:minmax(0,1fr);gap:32px}.lp-hero::before{background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.9) 45%,#000)}.lp-scroll{display:none}.lp-hero{padding-top:92px}}

.lp-in{max-width:1200px;margin:0 auto;padding:0 20px}
.lp-sec{padding:100px 0;scroll-margin-top:56px}
.lp-sec.light{background:linear-gradient(#f6f6f6,#ededed);color:#1a1a1a}
.lp-sec.light .eyebrow{color:rgba(26,26,26,.6)}
.lp-sec.light .eyebrow::before{background:#0092b0}
.lp-sec.light .muted{color:rgba(26,26,26,.62)}
.lp-sec.light h2{color:#1a1a1a}
.lp-sec.port{background:linear-gradient(210deg,#000,#000 28%,rgba(6,77,103,.6) 85%,rgba(6,77,103,.75) 92%,rgba(6,118,158,.6))}
.lp-h{max-width:720px;margin-bottom:44px}
.lp-h p{font-size:16px}

.lp-dual{display:grid;grid-template-columns:1fr 1fr}
.lp-panel{padding:64px max(20px,calc((100vw - 1200px)/2 + 20px)) 64px 48px;min-height:420px;display:flex;flex-direction:column;justify-content:center}
.lp-panel:first-child{padding-left:max(20px,calc((100vw - 1200px)/2 + 20px));padding-right:48px}
.lp-panel.cian{background:var(--grad);color:#000}
.lp-panel.cian .eyebrow{color:rgba(0,0,0,.66)}
.lp-panel.cian .eyebrow::before{background:#000}
.lp-panel.black{background:#000}
.lp-panel.black h2{color:#00b4d9}
.lp-panel h2{font:700 clamp(1.6rem,3vw,2.2rem)/1.1 var(--f-tech);letter-spacing:.04em;text-transform:uppercase;max-width:20ch}
.lp-panel p{max-width:46ch}
.lp-latest{border:1px solid currentColor;border-color:rgba(0,0,0,.25);padding:14px 16px;margin:10px 0 6px;max-width:420px}

@media (max-width:991px){.lp-dual{grid-template-columns:1fr}.lp-panel,.lp-panel:first-child{padding:56px 20px;min-height:0}}

.lp-stat span{color:rgba(26,26,26,.68);font-size:14px}
.lp-quote{margin-top:40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:40px;background:rgba(255,255,255,.95);border:1px solid rgba(0,0,0,.06);box-shadow:0 8px 30px rgba(0,0,0,.06);padding:34px}

.lp-comp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:28px}
.lp-c{background:linear-gradient(rgba(255,255,255,.04),rgba(255,255,255,.02)),linear-gradient(135deg,rgba(6,118,158,.1),transparent);border:1px solid rgba(255,255,255,.08);padding:26px 18px 22px;box-shadow:0 18px 40px rgba(0,0,0,.16);transition:transform .35s var(--ease),border-color .35s}
.lp-c:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.2)}
.lp-c .ic{width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;font:400 1.6rem var(--f-serif);color:rgba(238,238,238,.7);margin-bottom:18px;transition:all .45s var(--ease)}
.lp-c:hover .ic{border-color:#00b4d9;color:#00b4d9;transform:scale(1.06)}
.lp-c .tg{display:inline-block;padding:3px 10px;font:600 10px var(--f-tech);letter-spacing:.18em;text-transform:uppercase;border:1px solid rgba(0,180,217,.35);color:#46d5e6;margin-bottom:10px}
.lp-c h4{color:#fff;font-size:17px}
.lp-c p{font-size:14px;color:#999;margin-bottom:12px}
.lp .comp-img{margin-top:8px;border-color:rgba(255,255,255,.08)}
@media (max-width:991px){.lp-comp{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.lp-comp{grid-template-columns:minmax(0,1fr)}}

.lp-priv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.lp-pcard{background:rgba(255,255,255,.95);border:1px solid rgba(0,0,0,.06);box-shadow:0 8px 30px rgba(0,0,0,.06);padding:32px 26px}
.lp-pcard h3{color:#1a1a1a}
.lp-pcard ul{list-style:none;margin:14px 0 0;padding:0}
.lp-pcard li{padding:10px 0 10px 24px;border-top:1px solid rgba(26,26,26,.1);position:relative;color:rgba(26,26,26,.82)}
.lp-pcard li::before{content:"—";position:absolute;left:0;color:#0092b0}
.lp-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.lp-tags span{padding:4px 14px;font:600 11px var(--f-tech);letter-spacing:.18em;text-transform:uppercase;border:1px solid rgba(0,146,176,.35);color:#0092b0}
@media (max-width:760px){.lp-priv{grid-template-columns:minmax(0,1fr)}}

.roles{display:grid;margin:8px 0 26px;border-top:1px solid rgba(255,255,255,.16)}
.role{display:flex;gap:20px;align-items:center;text-align:left;padding:22px 6px;border:0;border-bottom:1px solid rgba(255,255,255,.16);background:transparent;cursor:pointer;width:100%;color:#eee;transition:padding .35s var(--ease),background .35s}
.role::after{content:"";margin-left:auto;width:28px;height:1px;background:rgba(238,238,238,.5);flex-shrink:0;transition:width .35s var(--ease),background .35s}
.role:hover{padding-left:16px;background:rgba(0,180,217,.06)}
.role:hover::after{width:44px;background:#00b4d9}
.role-n{font:600 13px var(--f-tech);color:#00b4d9;width:28px;flex-shrink:0;letter-spacing:.08em}
.role b{display:block;font:400 clamp(1.5rem,3vw,2rem)/1.1 var(--f-serif)}
.role small{display:block;color:#999;font-size:14px;margin-top:4px}

.lp-cierre{position:relative;min-height:70vh;display:flex;align-items:flex-end;overflow:hidden}
.lp-cierre img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lp-cierre::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.94),rgba(0,0,0,.45) 65%,rgba(0,0,0,.3))}
.lp-cierre .lp-in{position:relative;z-index:2;padding-bottom:80px;width:100%}
.lp-cierre p{font:400 clamp(2rem,5.4vw,4rem)/1.05 var(--f-serif);color:#fff;max-width:18ch;margin:0}
.lp-cierre p em{color:#46d5e6;font-style:italic}

.lp-foot{background:radial-gradient(circle at 88% 16%,rgba(63,141,255,.18),transparent 22%),radial-gradient(circle at 12% 100%,rgba(255,130,72,.1),transparent 18%),linear-gradient(#020202,#000);padding:74px 0 22px;border-top:1px solid rgba(255,255,255,.08)}
.lp-foot-g{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1fr);gap:40px}
.lp-foot h3{font:700 26px/1 var(--f-tech);letter-spacing:.12em;text-transform:uppercase;color:#fff;margin:6px 0 10px}
.lp-foot .role-l{font:600 12px var(--f-tech);letter-spacing:.18em;text-transform:uppercase;color:rgba(238,238,238,.64)}
.lp-foot p{max-width:440px;color:#999;font-size:14px}
.lp-foot h5{font:600 12px var(--f-tech);letter-spacing:.24em;text-transform:uppercase;color:rgba(238,238,238,.5);margin:0 0 14px}
.lp-foot ul{list-style:none;margin:0;padding:0}
.lp-foot li{padding:4px 0}
.lp-foot li button{background:none;border:0;padding:0;cursor:pointer;color:#eee;font:600 15px var(--f-tech);letter-spacing:.08em;text-transform:uppercase}
.lp-foot li button:hover{color:#00b4d9}
.lp-foot .names li{color:#bbb;font-size:13.5px}
.lp-copy{margin-top:48px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 12px var(--f-tech);letter-spacing:.14em;text-transform:uppercase;color:rgba(238,238,238,.45)}
@media (max-width:860px){.lp-foot-g{grid-template-columns:minmax(0,1fr);gap:28px}}

.rv{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ============ APP ============ */
.pwa{max-width:480px;margin:0 auto}
.pwa .card{padding:26px}
.pwa-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pwa-top .eyebrow{margin:0}
.zone-h{margin:22px 0 10px;font:600 12px/1 var(--f-tech);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.roomgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.roombtn{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;transition:border-color .2s}
.roombtn:hover{border-color:var(--celeste)}
.roombtn svg{width:34px;height:34px;flex-shrink:0}
.roombtn b{font:700 16px var(--f-tech);letter-spacing:.06em}
.checks{list-style:none;padding:0;margin:0 0 16px;border-top:1px solid var(--line)}
.checks li{position:relative;padding:11px 0 11px 28px;border-bottom:1px solid var(--line)}
.checks li::before{content:"";position:absolute;left:4px;top:18px;width:10px;height:6px;border-left:2px solid var(--celeste);border-bottom:2px solid var(--celeste);transform:rotate(-45deg)}
.choice{display:block;width:100%;text-align:left;padding:18px;border:1px solid var(--line);background:transparent;cursor:pointer;margin-bottom:10px;transition:border-color .2s,background .2s}
.choice:hover{border-color:var(--line-2)}
.choice b{display:block;font:500 1.45rem/1.15 var(--f-serif);margin-bottom:2px}
.choice span{color:var(--muted);font-size:.9rem}
.choice.on{border-color:var(--celeste);background:var(--celeste-soft)}
textarea,select,input[type=text]{width:100%;background:transparent;color:var(--fg);border:1px solid var(--line-2);border-radius:0;padding:11px;font:inherit}
select{background:var(--surface)}
textarea{resize:vertical;min-height:72px}
textarea:focus,select:focus{outline:none;border-color:var(--celeste)}
.field{margin:14px 0}
.field>label{display:block;font:600 12px/1.2 var(--f-tech);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0;cursor:pointer;font-size:.92rem}
.chk input{width:18px;height:18px;accent-color:var(--celeste)}
.count{font:800 6rem/1 var(--f-sans);letter-spacing:-.04em;margin:6px 0 14px}
.cdbar{height:2px;background:var(--line);overflow:hidden;margin-bottom:16px}
.cdbar i{display:block;height:100%;background:var(--grad);width:100%}
.summary{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.92rem;margin:14px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.summary dt{color:var(--muted);font:600 12px/1.8 var(--f-tech);letter-spacing:.12em;text-transform:uppercase}
.summary dd{margin:0}
.done-mark{width:52px;height:52px;border-radius:50%;border:1px solid var(--ok);position:relative;margin-bottom:18px}
.done-mark::after{content:"";position:absolute;left:16px;top:16px;width:18px;height:10px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.track{list-style:none;margin:18px 0;padding:0}
.track li{position:relative;padding:7px 0 7px 28px;color:var(--muted)}
.track li::before{content:"";position:absolute;left:5px;top:14px;width:9px;height:9px;border-radius:50%;border:1px solid var(--line-2);background:var(--bg)}
.track li::after{content:"";position:absolute;left:9px;top:25px;bottom:-8px;width:1px;background:var(--line-2)}
.track li:last-child::after{display:none}
.track li.done{color:var(--fg)}
.track li.done::before{background:var(--celeste);border-color:var(--celeste)}
.track li.now::before{animation:blink 1.4s ease-in-out infinite;border-color:var(--celeste)}

.q{margin-bottom:18px}
.q-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;margin-bottom:10px}
.scale{display:flex;border:1px solid var(--line-2)}
.scale label,.opts label{position:relative;cursor:pointer}
.scale label{flex:1}
.scale label+label span{border-left:1px solid var(--line-2)}
.scale input,.opts input{position:absolute;opacity:0;width:1px;height:1px}
.scale span{display:block;text-align:center;padding:12px 0;font:700 18px var(--f-tech)}
.scale-l{display:flex;justify-content:space-between;font:600 11px var(--f-tech);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts span{display:block;padding:9px 14px;border:1px solid var(--line-2);font-size:.9rem}
.scale input:checked+span,.opts input:checked+span{background:var(--celeste);border-color:var(--celeste);color:#000}
.scale input:focus-visible+span,.opts input:focus-visible+span{outline:2px solid var(--celeste-deep);outline-offset:2px}
.mood{display:inline-flex;gap:3px;vertical-align:middle}
.mood i{width:10px;height:10px;background:var(--line-2)}
.mood i.on{background:var(--celeste)}

.qlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.qrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px 12px;align-items:center;text-align:left;padding:14px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;width:100%;color:var(--fg);transition:background .2s}
.qrow:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.qrow.on{background:var(--celeste-soft);box-shadow:inset 2px 0 0 var(--celeste)}
.qrow.hot,.qrow.on.hot{box-shadow:inset 2px 0 0 var(--alert)}
.qrow .t{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.qrow .p{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .meta{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.tl{list-style:none;margin:14px 0 0;padding:0;font-size:.86rem}
.tl li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.tl li .mono{color:var(--muted);font-size:.78rem;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.92rem;margin:14px 0}
.kv dt{color:var(--muted);font:600 12px/1.8 var(--f-tech);letter-spacing:.12em;text-transform:uppercase}
.kv dd{margin:0;min-width:0}

.wave{display:flex;align-items:center;gap:3px;height:48px;margin:16px 0 10px}
.wave i{flex:1;height:40%;background:var(--celeste);animation:wv 1.5s ease-in-out infinite;transform-origin:center}
.wave.alert i{background:var(--alert);animation-duration:.75s}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1.9)}}

.cam{position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line-2);margin:14px 0;background:radial-gradient(ellipse at 20% 15%,rgba(160,200,215,.26),transparent 55%),linear-gradient(180deg,#18252c 0 56%,#26353c 56% 100%)}
.cam::before{content:"";position:absolute;left:0;right:0;top:44%;height:30%;border-top:4px solid #8399a3;background:repeating-linear-gradient(90deg,rgba(131,153,163,.9) 0 3px,transparent 3px 28px)}
.cam::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none}
.cam .who{position:absolute;left:57%;bottom:12%;width:10%;height:60%;filter:blur(6px)}
.cam .who::before{content:"";position:absolute;left:24%;top:0;width:52%;aspect-ratio:1;border-radius:50%;background:#c9b19c}
.cam .who::after{content:"";position:absolute;left:4%;top:20%;width:92%;bottom:0;border-radius:40% 40% 12% 12%;background:#45626f}
.cam .box{position:absolute;left:51%;top:22%;width:22%;height:70%;border:1px solid var(--alert);z-index:2}
.cam .box::before,.cam .box::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--alert);border-style:solid}
.cam .box::before{right:-4px;bottom:-4px;border-width:0 2px 2px 0}
.cam .box::after{left:-4px;bottom:-4px;border-width:0 0 2px 2px}
.cam .box span{position:absolute;left:-1px;top:-1px;transform:translateY(-100%);background:var(--alert);color:#140502;font:700 11px/1.5 var(--f-tech);letter-spacing:.12em;text-transform:uppercase;padding:1px 7px;white-space:nowrap}
.cam .hud{position:absolute;z-index:3;font:600 11px/1.4 var(--f-tech);letter-spacing:.12em;text-transform:uppercase;color:#e3f1f6;background:rgba(0,0,0,.55);padding:3px 8px}
.cam .h1{left:8px;top:8px}.cam .h2{right:8px;top:8px}.cam .h3{left:8px;bottom:8px}
.cam .h2::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff6b4f;margin-right:6px;vertical-align:middle;animation:blink 1.2s infinite}
.cam-closed{border:1px dashed var(--line-2);padding:14px;margin:14px 0;font-size:.9rem;color:var(--muted)}
@keyframes blink{50%{opacity:.25}}

.svgmap{width:100%;height:auto;display:block}
.svgmap .bld,.svgmap .room{fill:var(--sunk);stroke:var(--line-2);stroke-width:1}
.svgmap .patio{fill:none;stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 4}
.svgmap .lbl{fill:var(--muted);font:600 11px "Rajdhani",sans-serif;letter-spacing:.06em}
.svgmap .lbl.s{font-size:9.5px}
.svgmap .rail{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 4}
.svgmap .hot{fill:var(--alert-soft);stroke:var(--alert);stroke-width:1.5;animation:hot 1.6s ease-in-out infinite}
.svgmap .dot{fill:var(--alert)}
.svgmap .dot.amb{fill:var(--warn)}
.svgmap .dot.cel{fill:var(--celeste)}
.svgmap .ring{fill:none;stroke:var(--alert);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
.svgmap .ring.amb{stroke:var(--warn)}
.svgmap .ring.cel{stroke:var(--celeste)}
@keyframes hot{50%{opacity:.5}}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg .btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.stepper{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0;border:1px solid var(--line-2)}
.stepper span{padding:10px 4px;text-align:center;font:600 12px/1.3 var(--f-tech);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stepper span+span{border-left:1px solid var(--line-2)}
.stepper span.done{background:var(--celeste-soft);color:var(--celeste)}
.guide{counter-reset:g;list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.guide li{counter-increment:g;position:relative;padding:14px 0 14px 54px;border-bottom:1px solid var(--line)}
.guide li::before{content:counter(g,decimal-leading-zero);position:absolute;left:0;top:10px;font:400 2rem/1 var(--f-serif);color:var(--celeste)}
.guide li b{display:block;font:500 1.25rem/1.2 var(--f-serif)}

.rank{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rank-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.rank-row.best{box-shadow:inset 2px 0 0 var(--ok);padding-left:12px}
.rank-row b{font:500 1.25rem var(--f-serif)}
.rank-row .eta{font:800 1.5rem/1 var(--f-sans)}
.rank-row small{display:block;color:var(--muted);margin:2px 0 6px}
.calwrap{overflow-x:auto;margin-top:12px}
.cal{width:100%;border-collapse:collapse;min-width:620px;font-size:.84rem}
.cal tbody th,.cal thead th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.cal th{text-align:left;color:var(--muted);font:600 12px var(--f-tech);letter-spacing:.14em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--line)}
.cal td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.slot{border-left:2px solid var(--line-2);padding:4px 8px}
.slot+.slot{margin-top:6px}
.slot.reinf{border-left-color:var(--celeste);background:var(--celeste-soft);color:var(--celeste);font-weight:600}
.slot .mono{font-size:.74rem}

.bars{display:grid;grid-template-columns:max-content minmax(0,1fr) auto;align-items:center;gap:12px;font:600 14px var(--f-tech);letter-spacing:.06em;text-transform:uppercase}
.bar{display:contents}
.bar .track2{height:10px;background:var(--sunk);border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--grad)}
.bar .fill.hi{background:var(--alert)}
.bar .n{font:800 16px var(--f-sans);text-align:right}

.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.qrcard svg{width:100%;height:auto;display:block;background:#fff;padding:6px;margin-bottom:10px}
.qrcard b{font:700 18px var(--f-tech);letter-spacing:.06em}

.patgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.pat{border-bottom:1px solid var(--line);padding:20px 22px 20px 0;min-width:0}
.patgrid .pat:nth-child(odd){border-right:1px solid var(--line)}
.patgrid .pat:nth-child(even){padding-left:22px}
.pat.ante b{color:var(--muted)}
.pat .mono{color:var(--celeste);font-size:.84rem;margin:10px 0 2px;word-break:break-all}
.pat b{font:500 1.3rem/1.2 var(--f-serif)}
.pat a{font:600 12px var(--f-tech);letter-spacing:.14em;text-transform:uppercase}
.pat a::after{content:" ↗"}
@media (max-width:700px){.patgrid{grid-template-columns:minmax(0,1fr)}.patgrid .pat:nth-child(odd){border-right:0}.patgrid .pat:nth-child(even){padding-left:0}}

.hero{border-top:1px solid var(--line);padding:28px 0 8px}
.hero h2{font-size:clamp(2rem,5.5vw,3.6rem);max-width:18ch}
.hero h2 em{color:var(--celeste)}

.plist li::before{content:"—";position:absolute;left:0;color:var(--celeste)}
.cierre{position:relative;overflow:hidden;min-height:360px;display:grid;align-items:end;padding:40px 28px;background:#000;border:1px solid var(--line)}

.toast.alert{border-left-color:var(--alert)}
.toast.ok{border-left-color:var(--ok)}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function hhmm(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}
function dayLabel(ts){var d=new Date(ts);return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()];}
function sameDay(a,b){var x=new Date(a),y=new Date(b);return x.toDateString()===y.toDateString();}

function nextWeekdays(n){var out=[],d=new Date();d.setHours(12,0,0,0);while(out.length<n){d=new Date(d.getTime()+DAY);if(d.getDay()!==0)out.push(dayLabel(d.getTime()));}return out;}

function etaOf(b,z){
  if(b.building===z.building)return 1+Math.abs(z.floor-b.floor);
  return 4+Math.round(z.floor/2);
}
function busy(bid,exceptId){return S.alerts.some(function(x){return x.brigadista===bid&&x.id!==exceptId&&ASSIGNED.indexOf(x.status)>=0;});}
function rank(a){

  a.brigadista=bid;a.eta=eta;a.status='avisada';a.assignedAt=Date.now();

  var r=rank(a).filter(function(x){return !x.busy&&!x.off;})[0];

  assign(a,r.b.id,r.eta,true);

function qrSvg(text,size){

  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    var inF=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);

  }

}

var root=document.getElementById('root');
function snapshot(){
  var m=document.getElementById('main');if(!m)return null;
  var vals={};
  m.querySelectorAll('input,textarea,select').forEach(function(el){
    var k=el.id||(el.name?el.name+'|'+(el.type==='radio'?el.value:''):'');if(!k)return;
    vals[k]=(el.type==='radio'||el.type==='checkbox')?{c:el.checked}:{v:el.value};
  });
  var f=document.activeElement;
  return {vals:vals,focus:(f&&m.contains(f)&&f.id)?f.id:null};
}
function restore(snap){
  if(!snap)return;var m=document.getElementById('main');if(!m)return;
  m.querySelectorAll('input,textarea,select').forEach(function(el){
    var k=el.id||(el.name?el.name+'|'+(el.type==='radio'?el.value:''):'');var v=snap.vals[k];if(!v)return;
    if('c' in v)el.checked=v.c;else el.value=v.v;
  });
  if(snap.focus){var f=document.getElementById(snap.focus);if(f)try{f.focus({preventScroll:true});}catch(e){}}
}

function revealSetup(){
  var els=root.querySelectorAll('.rv');
  var reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(reduce||!('IntersectionObserver' in window)){els.forEach(function(el){el.classList.add('in');});return;}
  try{
    var io=new IntersectionObserver(function(ents){ents.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});},{threshold:.12,rootMargin:'0px 0px -40px 0px'});
    els.forEach(function(el,i){el.style.transitionDelay=(i%4)*70+'ms';io.observe(el);});
  }catch(e){els.forEach(function(el){el.classList.add('in');});}
  setTimeout(function(){root.querySelectorAll('.lp-hero .rv').forEach(function(el){el.classList.add('in');});},60);
}

/* ---------- Operador ---------- */
function sortedQueue(list){
  return list.slice().sort(function(a,b){
    var aa=isActive(a)?0:1,bb=isActive(b)?0:1;if(aa!==bb)return aa-bb;
    if(aa===0){if(PRIO_N[a.priority]!==PRIO_N[b.priority])return PRIO_N[a.priority]-PRIO_N[b.priority];return a.created-b.created;}
    return b.created-a.created;
  });
}
function queueList(list){
  if(!list.length)return '<div class="empty">Sin alertas activas.</div>';
  return '<div class="qlist">'+sortedQueue(list).map(function(a){
    var hot=a.status==='verificando'||a.status==='nueva';
    return '<button class="qrow'+(view.sel===a.id?' on':'')+(hot?' hot':'')+'" data-a="sel" data-id="'+a.id+'">'+
      '<span class="t">'+hhmm(a.created)+'</span><span class="p">'+esc(placeShort(a))+'</span>'+pill(a.priority,PRIO[a.priority])+
      '<span class="meta"><span>'+esc(a.origin)+'</span>'+statusPill(a)+(a.brigadista&&isActive(a)?'<span>· '+esc(bname(a.brigadista))+'</span>':'')+'</span></button>';
  }).join('')+'</div>';
}
function selAlert(list){
  var a=view.sel?alertById(view.sel):null;
  if(a&&list.indexOf(a)>=0)return a;
  var s=sortedQueue(list)[0];return s||null;
}
function timeline(a){return '<ul class="tl">'+a.events.map(function(e){return '<li><span class="mono">'+hhmm(e.t)+'</span><span>'+esc(e.x)+'</span></li>';}).join('')+'</ul>';}

/* ---------- Avisos ---------- */
function toast(text,kind){
  var box=document.getElementById('toasts'),t=document.createElement('div');
  t.className='toast '+(kind||'');t.textContent=text;box.appendChild(t);
  setTimeout(function(){t.remove();},4200);
}
function notifyDiff(old,nw){
  if(!old||!role)return;
  var om={};old.alerts.forEach(function(a){om[a.id]=a;});
  nw.alerts.forEach(function(a){
    var o=om[a.id];
    if(role==='operador'){
      if(!o)toast('Nueva alerta · '+placeShort(a),'alert');
      else if(o.status!==a.status)toast(a.code+': '+STATUS[a.status][0]);
    }
    if(role==='brigadista'&&a.brigadista===me&&ASSIGNED.indexOf(a.status)>=0&&(!o||o.brigadista!==me))toast('Alerta asignada · '+placeShort(a),'alert');
    if(role==='bienestar'&&o){
      if(a.status==='cerrada'&&o.status!=='cerrada')toast('Caso '+a.code+' pasa a seguimiento');
      if(a.followUp&&o.followUp&&a.followUp.responses.length>o.followUp.responses.length)toast('Formulario recibido · '+a.code,'ok');
    }
    if(role==='estudiante'&&o&&a.mine&&a.followUp&&o.followUp&&a.followUp.sent.length>o.followUp.sent.length)toast('Bienestar te envió un formulario corto');
  });
}

}
function closePat(){pp.hidden=true;}

/* ---------- Acciones ---------- */
function goTab(t){tab=t;view.citaOpen=null;saveNav();render();try{window.scrollTo(0,0);}catch(e){}}
document.addEventListener('click',function(e){
  var chip=e.target.closest('.pchip[data-p]');
  if(chip){e.preventDefault();e.stopPropagation();openPat(+chip.getAttribute('data-p'),chip);return;}
  if(!pp.hidden&&!e.target.closest('#ppanel'))closePat();
  var t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  var act=t.getAttribute('data-a'),id=t.getAttribute('data-id'),a=id?alertById(id):null;
  switch(act){
    case 'ppclose':closePat();break;
    case 'role':role=t.getAttribute('data-r');tab=ROLES[role].tabs[0][0];view.sel=null;view.mapZone=null;saveNav();render();try{window.scrollTo(0,0);}catch(err){}break;
    case 'tab':goTab(t.getAttribute('data-t'));break;
    case 'logout':role=null;tab=null;saveNav();render();try{window.scrollTo(0,0);}catch(err){}break;
    case 'scroll':var tg=document.getElementById(t.getAttribute('data-to'));if(tg)try{tg.scrollIntoView({behavior:'smooth',block:'start'});}catch(err){tg.scrollIntoView();}break;
    case 'enter':role=t.getAttribute('data-r');tab=ROLES[role].tabs[0][0];view.sel=null;saveNav();render();try{window.scrollTo(0,0);}catch(err){}break;
    case 'theme':S.settings.theme=S.settings.theme==='dark'?'light':'dark';commit();break;
    case 'reset':
      if(Date.now()-view.resetArm<4000){S=seed();view.resetArm=0;view.sel=null;view.crisis=false;stuReset();commit();toast('Datos de demo reiniciados','ok');}
      else{view.resetArm=Date.now();render();setTimeout(function(){if(view.resetArm&&Date.now()-view.resetArm>=4000)render();},4100);}
      break;
    /* estudiante */
    case 'qr':view.stu.zone=t.getAttribute('data-z');view.stu.spot=t.getAttribute('data-s');view.stu.step='privacidad';render();try{window.scrollTo(0,0);}catch(err){}break;
    case 'priv-ok':view.stu.step='tipo';view.stu.cancelled=false;render();break;
    case 'type':view.stu.type=t.getAttribute('data-v');render();break;
    case 'send-start':if(!view.stu.type)break;var ta=document.getElementById('stu-note');if(ta)view.stu.note=ta.value;view.stu.step='confirmar';view.stu.deadline=Date.now()+10000;render();break;
    case 'send-now':sendStudent();break;
    case 'send-cancel':view.stu.step='tipo';view.stu.cancelled=true;render();break;
    case 'stu-reset':stuReset();render();break;
    case 'goto-alert':view.crisis=false;if(view.stu.step==='listo')stuReset();goTab('alerta');break;
    case 'crisis-ok':view.crisis=false;render();break;
    /* operador */
    case 'sel':view.sel=id;render();break;
    case 'sel-tab':view.sel=id;goTab('tablero');break;
    case 'to-despacho':view.sel=id;goTab('despacho');break;
    case 'mapz':view.mapZone=t.getAttribute('data-z');render();break;
    case 'sim':
      var s=SENSORS.filter(function(x){return x.id===id;})[0];
      if(!s||S.alerts.some(function(x){return x.sensor===s.id&&x.status==='verificando';}))break;
      var opts=s.spot==='Escaleras'?[1,2]:[0,2];
      var na=createAlert({origin:'Vigía',type:'vigia',zone:s.zone,spot:s.spot,sensor:s.id,priority:'Alta',status:'verificando',detail:PATTERNS[opts[Math.random()<.75?0:1]]});
      view.sel=na.id;commit();break;
    case 'verify':if(!a)break;a.camOpen=true;ev(a,'Operador abrió el fragmento de cámara de la zona (rostro difuminado).');commit();break;
    case 'confirm':if(!a)break;a.camOpen=false;a.status='nueva';ev(a,'Anomalía confirmada por el operador. Se cierra la cámara.');autoAssign(a);commit();break;
    case 'discard':if(!a)break;a.camOpen=false;a.status='descartada';ev(a,'Alerta descartada por el operador. No se guarda video.');commit();toast('Alerta descartada por el operador. No se guarda video.');break;
    case 'assign':
      if(!a)break;var bid=t.getAttribute('data-b'),b=brig(bid);
      assign(a,bid,etaOf(b,zone(a.zone)),false);commit();toast(b.name+' avisada a la vez que la central','ok');break;
    /* brigadista */
    case 'go':if(!a)break;a.status='en_camino';ev(a,bname(a.brigadista)+' va en camino.');commit();break;
    case 'arrive':if(!a)break;a.status='en_lugar';a.arrivedAt=Date.now();ev(a,bname(a.brigadista)+' llegó al lugar.');commit();break;
    case 'escalate':if(!a)break;a.riesgo=true;ev(a,'Riesgo inminente: se llamó al psicólogo de guardia.');commit();toast('Psicólogo de guardia avisado','alert');break;
    case 'close':
      if(!a)break;var nt=document.getElementById('note-'+a.id),note=nt?nt.value.trim():'';
      if(!note){toast('Escribe una nota breve antes de cerrar.');if(nt)nt.focus();break;}
      a.status='cerrada';a.closedAt=Date.now();a.note=note;a.followUp={sent:[],responses:[],appointment:null};
      ev(a,'Caso cerrado. Pasa a seguimiento de bienestar.');commit();toast('Caso cerrado. Bienestar se encarga del seguimiento.','ok');break;
    /* bienestar */
    case 'send-form':
      if(!a||!a.followUp)break;var stg=STAGES[a.followUp.sent.length];if(!stg)break;
      a.followUp.sent.push({stage:stg,at:Date.now()});ev(a,'Bienestar envió el formulario de '+stg+'.');commit();toast('Formulario de '+stg+' enviado','ok');break;
    case 'open-cita':view.citaOpen=id||null;render();break;
    case 'save-cita':
      if(!a||!a.followUp)break;var dd=document.getElementById('cd-'+a.id),tt=document.getElementById('ct-'+a.id);
      a.followUp.appointment={date:dd?dd.value:'',time:tt?tt.value:''};ev(a,'Cita prioritaria con psicología: '+a.followUp.appointment.date+', '+a.followUp.appointment.time+'.');
      view.citaOpen=null;commit();toast('Cita agendada','ok');break;
    case 'cal':view.calMode=t.getAttribute('data-m');render();break;
    /* admin */
    case 'brig-turno':var bb=brig(t.getAttribute('data-b'));if(!bb)break;bb.state=bb.state==='fuera'?'disponible':'fuera';commit();break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target,c=t.getAttribute&&t.getAttribute('data-c');if(!c)return;
  if(c==='pat'){S.settings.pat=t.checked;commit();}
  else if(c==='theme'){S.settings.theme=t.checked?'light':'dark';commit();}
  else if(c==='anon'){view.stu.anon=t.checked;}
  else if(c==='closed'){view.showClosed=t.checked;render();}
  else if(c==='me'){me=t.value;saveNav();render();}
  else if(c==='prio'){var a=alertById(t.getAttribute('data-id'));if(a){a.priority=t.value;ev(a,'Prioridad cambiada a '+t.value.toLowerCase()+'.');commit();}}
});
document.addEventListener('input',function(e){if(e.target.id==='stu-note')view.stu.note=e.target.value;});
document.addEventListener('submit',function(e){
  var f=e.target;if(f.getAttribute('data-f')!=='fu')return;e.preventDefault();
  var a=alertById(f.getAttribute('data-id'));if(!a||!a.followUp)return;
  function val(n){var el=f.querySelector('input[name="'+n+'-'+a.id+'"]:checked');return el?el.value:'Sin respuesta';}
  var mood=val('mood');
  if(mood==='Sin respuesta'){toast('Elige cómo te sientes del 1 al 5.');return;}
  var r={stage:f.getAttribute('data-stage'),at:Date.now(),mood:+mood,sleep:val('sleep'),talk:val('talk'),cita:val('cita'),help:val('help')};
  a.followUp.responses.push(r);ev(a,'El estudiante respondió el formulario de '+r.stage+'.');
  if(r.help==='Sí')view.crisis=true;
  commit();toast('Respuestas enviadas. Gracias.','ok');
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePat();});
window.addEventListener('scroll',function(){if(!pp.hidden)closePat();},{passive:true});
window.addEventListener('resize',function(){closePat();var nav=root.querySelector('.tabs');if(nav)tabsFade(nav);});

function sendStudent(){
  var st=view.stu;if(st.step!=='confirmar')return;
  var a=createAlert({origin:'Compañero',type:st.type,zone:st.zone,spot:st.spot,priority:st.type==='hablar'?'Alta':'Media',detail:(st.note||'').trim(),anon:st.anon,mine:st.type==='hablar'});
  st.alertId=a.id;st.step='listo';store('cc_stu_alert',a.id,true);commit();
}
setInterval(function(){
  if(role!=='estudiante'||view.stu.step!=='confirmar')return;
  var rem=view.stu.deadline-Date.now();
  if(rem<=0){sendStudent();return;}
  var cd=document.getElementById('cd'),bar=document.getElementById('cdbar');
  if(cd)cd.textContent=Math.ceil(rem/1000);if(bar)bar.style.width=(rem/100)+'%';
},200);

/* ---------- Sincronización entre pestañas ---------- */
window.addEventListener('storage',function(e){
  if(e.key!==KEY&&e.key!==null)return;
  var old=S;
  if(!e.newValue&&e.key===KEY){S=seed();}
  else{try{var s=JSON.parse(e.newValue||store(KEY));if(s&&s.alerts)S=s;}catch(err){return;}}
  notifyDiff(old,S);applySettings();render();
});

/* ---------- Inicio ---------- */
S=load();
(function(){
  var hr='';try{hr=(location.hash||'').slice(1);}catch(e){}
  var parts=hr.split('/');
  if(parts[0]&&ROLES[parts[0]]){role=parts[0];tab=parts[1]||null;}
  else{var r=store('cc_role',undefined,true);if(r&&ROLES[r]){role=r;tab=store('cc_tab',undefined,true);}}
  var m=store('cc_me',undefined,true);if(m)me=m;
  var sa=store('cc_stu_alert',undefined,true);
  if(sa&&alertById(sa)){view.stu.alertId=sa;view.stu.step='listo';var x=alertById(sa);view.stu.type=x.type;view.stu.zone=x.zone;view.stu.spot=x.spot;}
})();
applySettings();
render();
if(role)saveNav();
})();
</script>
</body>
</html>
